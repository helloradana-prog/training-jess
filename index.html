<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jessica Silva · Consultoria de Treino</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap');

  :root {
    --cream: #F7F5F2;
    --offwhite: #FDFCFB;
    --purple-light: #E8E0F0;
    --purple-mid: #C4A8D8;
    --purple: #9B72BB;
    --purple-dark: #6D4D8A;
    --green-light: #DFF0E8;
    --green-mid: #A8D4B8;
    --green: #6BB58A;
    --green-dark: #4A8A65;
    --text-dark: #2C2438;
    --text-mid: #6B5F7A;
    --text-light: #A898B8;
    --border: #E8E2EE;
    --shadow: rgba(107, 77, 138, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--offwhite);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--purple-dark); }
  .header-sub { font-size: 11px; color: var(--text-light); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--purple-mid), var(--green-mid)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: white; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--offwhite);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-btn {
    flex: 1; padding: 10px 4px 8px;
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-light); font-size: 10px; font-family: 'DM Sans', sans-serif;
    transition: color 0.2s;
  }
  .nav-btn.active { color: var(--purple-dark); }
  .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.active .nav-icon { filter: none; }

  /* ── CONTENT AREA ── */
  .content { padding: 16px 16px 90px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--offwhite);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px var(--shadow);
    margin-bottom: 12px;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px; color: var(--purple-dark); margin-bottom: 10px;
  }

  /* ── HOME SCREEN ── */
  .week-selector {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--offwhite);
    border-radius: 14px; border: 1px solid var(--border);
    padding: 12px 16px; margin-bottom: 16px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .week-nav { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--purple); padding: 4px 8px; border-radius: 8px; }
  .week-nav:active { background: var(--purple-light); }
  .week-info { text-align: center; }
  .week-label { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.08em; }
  .week-num { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--purple-dark); line-height: 1.1; }

  .treino-cards { display: flex; flex-direction: column; gap: 10px; }
  .treino-card {
    border-radius: 16px; padding: 16px 18px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
  }
  .treino-card:active { transform: scale(0.98); }
  .treino-card.card-a { background: linear-gradient(135deg, #F0EBF8 0%, var(--offwhite) 100%); }
  .treino-card.card-b { background: linear-gradient(135deg, #E8F4EE 0%, var(--offwhite) 100%); }
  .treino-card.card-c { background: linear-gradient(135deg, #F0EBF8 0%, #E8F4EE 100%); }
  .treino-card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-light); margin-bottom: 4px; }
  .treino-card-name { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--text-dark); margin-bottom: 6px; }
  .treino-card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .meta-pill {
    font-size: 10px; padding: 3px 8px; border-radius: 20px;
    background: rgba(255,255,255,0.7); color: var(--text-mid);
  }
  .treino-card-dot {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: var(--green-mid);
  }
  .treino-card.done .treino-card-dot { background: var(--green); }
  .treino-card-progress {
    margin-top: 10px; height: 3px; border-radius: 2px;
    background: var(--border); overflow: hidden;
  }
  .treino-card-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--purple-mid), var(--green-mid)); transition: width 0.4s; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat-card { background: var(--offwhite); border-radius: 12px; border: 1px solid var(--border); padding: 12px; text-align: center; }
  .stat-val { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--purple-dark); }
  .stat-label { font-size: 10px; color: var(--text-light); margin-top: 2px; }

  /* ── TREINO SCREEN ── */
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer;
    color: var(--purple); font-size: 14px; font-family: 'DM Sans', sans-serif;
    padding: 0 0 14px 0; font-weight: 500;
  }
  .treino-header-card {
    border-radius: 16px; padding: 20px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--purple-light), var(--green-light));
    border: 1px solid var(--border);
  }
  .treino-h-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--purple); }
  .treino-h-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--purple-dark); margin: 4px 0 8px; }
  .treino-h-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-mid); }
  .progress-wrap { margin-top: 12px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mid); margin-bottom: 4px; }
  .progress-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.5); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--purple), var(--green)); transition: width 0.4s; }

  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-light); padding: 6px 0 8px; font-weight: 600;
  }

  /* ── EXERCISE ROW ── */
  .exercise-item {
    background: var(--offwhite);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .exercise-item.checked { border-color: var(--green-mid); background: linear-gradient(135deg, var(--offwhite), #F0FAF4); }
  .exercise-main {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 14px 12px;
    cursor: pointer;
  }
  .check-circle {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--border); background: white;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: white; font-size: 14px;
  }
  .exercise-item.checked .check-circle {
    background: var(--green); border-color: var(--green); color: white;
  }
  .exercise-info { flex: 1; min-width: 0; }
  .exercise-name { font-size: 14px; font-weight: 500; color: var(--text-dark); line-height: 1.2; }
  .exercise-item.checked .exercise-name { color: var(--text-mid); text-decoration: line-through; text-decoration-color: var(--green-mid); }
  .exercise-meta { font-size: 11px; color: var(--text-light); margin-top: 3px; }
  .rpe-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--purple-light); color: var(--purple-dark); font-weight: 600; }
  .expand-btn { font-size: 18px; color: var(--text-light); flex-shrink: 0; transition: transform 0.2s; }
  .exercise-item.expanded .expand-btn { transform: rotate(180deg); }

  .exercise-detail {
    display: none; border-top: 1px solid var(--border);
    padding: 14px; background: rgba(248,246,252,0.5);
  }
  .exercise-item.expanded .exercise-detail { display: block; }

  .weight-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .weight-label { font-size: 12px; color: var(--text-mid); flex-shrink: 0; }
  .weight-ctrl { display: flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .weight-btn { width: 36px; height: 36px; background: var(--cream); border: none; cursor: pointer; font-size: 18px; color: var(--purple); font-weight: 600; }
  .weight-btn:active { background: var(--purple-light); }
  .weight-val { min-width: 54px; text-align: center; font-size: 15px; font-weight: 600; color: var(--text-dark); font-family: 'Playfair Display', serif; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .weight-unit { font-size: 11px; color: var(--text-light); }

  .tip-box { background: var(--purple-light); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--purple-dark); line-height: 1.5; margin-bottom: 10px; }
  .tip-box strong { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 3px; color: var(--purple); }
  .focus-box { background: var(--green-light); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--green-dark); margin-bottom: 10px; }
  .focus-box strong { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .error-box { background: #FFF0F0; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #C44; margin-bottom: 8px; }
  .error-box strong { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .sets-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .set-chip {
    padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 500;
    border: 1.5px solid var(--border); background: white; cursor: pointer;
    color: var(--text-mid); transition: all 0.15s;
  }
  .set-chip.done { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }

  .cardio-block {
    background: linear-gradient(135deg, var(--green-light), var(--offwhite));
    border: 1px solid var(--green-mid);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
  }
  .cardio-block h4 { font-size: 13px; color: var(--green-dark); margin-bottom: 4px; }
  .cardio-block p { font-size: 12px; color: var(--text-mid); }

  .complete-btn {
    width: 100%; padding: 16px; border-radius: 14px;
    background: linear-gradient(135deg, var(--purple), var(--green));
    border: none; color: white; font-size: 15px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    margin-top: 16px; letter-spacing: 0.02em;
    transition: opacity 0.2s; box-shadow: 0 4px 16px rgba(107,77,138,0.25);
  }
  .complete-btn:active { opacity: 0.88; }
  .complete-btn:disabled { background: var(--border); color: var(--text-light); box-shadow: none; }

  /* ── GUIA ── */
  .guia-list { display: flex; flex-direction: column; gap: 8px; }
  .guia-item { background: var(--offwhite); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .guia-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
  .guia-name { font-size: 14px; font-weight: 500; color: var(--text-dark); }
  .guia-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--purple-light); color: var(--purple-dark); font-weight: 600; flex-shrink: 0; }
  .guia-arrow { font-size: 16px; color: var(--text-light); transition: transform 0.2s; }
  .guia-item.open .guia-arrow { transform: rotate(180deg); }
  .guia-body { display: none; padding: 0 16px 14px; border-top: 1px solid var(--border); }
  .guia-item.open .guia-body { display: block; }
  .guia-row { margin-top: 10px; font-size: 12px; color: var(--text-mid); line-height: 1.55; }
  .guia-row strong { color: var(--text-dark); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 2px; }
  .guia-row + .guia-row { margin-top: 8px; }

  /* ── AVALIAÇÃO ── */
  .eval-week-sel { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .eval-week-sel select {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--offwhite);
    font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text-dark);
    appearance: none; -webkit-appearance: none;
  }

  .slider-item { margin-bottom: 16px; }
  .slider-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .slider-name { font-size: 13px; font-weight: 500; color: var(--text-dark); }
  .slider-val { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--purple-dark); min-width: 24px; text-align: right; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 5px;
    border-radius: 3px; background: var(--border); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--green));
    cursor: pointer; box-shadow: 0 2px 8px rgba(107,77,138,0.3);
  }

  .notes-area {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--text-dark); background: var(--offwhite);
    resize: none; margin-bottom: 12px;
  }
  .notes-area:focus { outline: none; border-color: var(--purple-mid); }

  .save-btn {
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--purple); border: none; color: white;
    font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: opacity 0.2s;
  }
  .save-btn:active { opacity: 0.85; }

  /* ── HISTÓRICO ── */
  .hist-empty { text-align: center; padding: 40px 20px; color: var(--text-light); font-size: 14px; }
  .hist-item {
    background: var(--offwhite); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
  }
  .hist-week-label { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--purple-dark); margin-bottom: 8px; }
  .hist-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-mid); padding: 4px 0; border-bottom: 1px solid var(--border); }
  .hist-row:last-child { border-bottom: none; }
  .hist-metric { color: var(--text-dark); font-weight: 500; }
  .medidas-card { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .medida-item { background: var(--offwhite); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .medida-val { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--purple-dark); }
  .medida-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--purple-light); color: var(--purple-dark); }
  .chip.green { background: var(--green-light); color: var(--green-dark); }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--purple-dark); color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .intensidade-legend {
    background: var(--offwhite); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .intensidade-legend h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-light); margin-bottom: 8px; }
  .rpe-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .rpe-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── DASHBOARD / PIN ── */
  .pin-overlay {
    position:fixed;inset:0;background:rgba(44,36,56,0.7);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:300;
  }
  .pin-overlay.hidden{display:none;}
  .pin-box{background:var(--offwhite);border-radius:20px;padding:28px 24px;width:88%;max-width:320px;text-align:center;}
  .pin-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--purple-dark);margin-bottom:4px;}
  .pin-sub{font-size:12px;color:var(--text-light);margin-bottom:18px;}
  .pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:18px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:white;transition:all 0.15s;}
  .pin-dot.filled{background:var(--purple);border-color:var(--purple);}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .pin-key{padding:14px;background:var(--cream);border:1px solid var(--border);border-radius:12px;
    font-size:18px;font-weight:600;color:var(--text-dark);cursor:pointer;font-family:'Playfair Display',serif;}
  .pin-key:active{background:var(--purple-light);}
  .pin-key.wide{grid-column:span 2;}
  .pin-err{font-size:12px;color:#C44;height:16px;margin-top:-8px;}
  .dash-card{background:var(--offwhite);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
  .dash-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--purple-dark);margin-bottom:12px;}
  .dash-week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px;}
  .dash-week-cell{border-radius:8px;padding:6px 4px;text-align:center;border:1px solid var(--border);background:var(--cream);}
  .dash-week-cell.has-eval{background:var(--purple-light);border-color:var(--purple-mid);}
  .dash-week-cell.has-treino{background:var(--green-light);border-color:var(--green-mid);}
  .dash-week-cell.has-both{background:linear-gradient(135deg,var(--purple-light),var(--green-light));border-color:var(--purple-mid);}
  .dash-wnum{font-size:11px;font-weight:600;color:var(--text-dark);}
  .dash-wlbl{font-size:9px;color:var(--text-light);margin-top:1px;}
  .dash-metric-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .dash-metric-row:last-child{border:none;}
  .dash-metric-val{font-family:'Playfair Display',serif;font-size:15px;color:var(--purple-dark);}
  .dash-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden;}
  .dash-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--purple-mid),var(--green-mid));}
  .dash-table{width:100%;border-collapse:collapse;font-size:11px;}
  .dash-table th{text-align:left;color:var(--text-light);font-weight:600;padding:4px 6px;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;}
  .dash-table td
